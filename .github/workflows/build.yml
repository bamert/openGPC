name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libpng-dev

    - name: Configure
      run: mkdir build && cd build && cmake ..

    - name: Build
      run: cd build && make -j

    - name: Test
      run: cd build && ctest --output-on-failure

